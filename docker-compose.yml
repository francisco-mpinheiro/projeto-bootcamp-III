services:
  postgres:
    image: postgres:16-alpine
    container_name: stockly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockly_user
      POSTGRES_PASSWORD: stockly_password
      POSTGRES_DB: stockly_db
    ports:
      - "5433:5432"
    volumes:
      - stockly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockly_user -d stockly_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockly_api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://stockly_user:stockly_password@postgres:5432/stockly_db?schema=public
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockly_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  # Harness de testes: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockly_test
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://stockly_user:stockly_password@postgres:5432/stockly_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["npm", "run", "test:coverage"]

volumes:
  stockly_pgdata:
